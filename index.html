<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07060f" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27 shape-rendering=%27crispEdges%27%3E%3Crect width=%2716%27 height=%2716%27 fill=%27%2307060f%27/%3E%3Crect x=%274%27 y=%272%27 width=%278%27 height=%2712%27 fill=%27%23c9961e%27/%3E%3Crect x=%275%27 y=%273%27 width=%276%27 height=%2710%27 fill=%27%237a1538%27/%3E%3Crect x=%277%27 y=%275%27 width=%272%27 height=%272%27 fill=%27%23fff2a8%27/%3E%3Crect x=%276%27 y=%278%27 width=%274%27 height=%271%27 fill=%27%233ec4d4%27/%3E%3C/svg%3E" />
  <title>Pixel Trophy Case — Galactic Bespoke Edition</title>
  <link rel="stylesheet" href="./src/ui/style.css" />
</head>
<body>
  <main id="stage" aria-label="Pixel Trophy Case animation">
    <canvas id="screen" width="384" height="216"></canvas>
    <canvas id="bloom" width="192" height="108" aria-hidden="true"></canvas>
  </main>
  <header id="hud">
    <div class="title">
      <span class="t1">PIXEL TROPHY CASE</span>
      <span class="t2">Galactic Bespoke Edition · for the High Throne of Cyiurkhhn IV</span>
    </div>
    <nav class="controls" aria-label="Controls">
      <button id="btn-sound" type="button" aria-pressed="false" title="Sound (S)">Sound off</button>
      <button id="btn-speed" type="button" title="Speed (1 / 2 / 3)">1×</button>
      <button id="btn-skip" type="button" title="Next (N)">Next</button>
      <button id="btn-pause" type="button" aria-pressed="false" title="Pause (Space)">Pause</button>
    </nav>
  </header>
  <div id="phase" aria-live="polite"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
