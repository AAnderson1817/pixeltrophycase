name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Format, build, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run format:check
      - run: npm run lint
      - name: Tests (dev server)
        run: npm test
      - name: Tests (built dist/index.html)
        run: npm run test:dist

  sprites:
    name: Atlas reproduces from art/sheets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/sprites/*.txt
      - run: pip install -r tools/sprites/requirements.txt -c tools/sprites/constraints.txt
      - run: python3 tools/sprites/extract.py
      - name: Committed atlas matches the pipeline output
        run: git diff --exit-code -- src/assets/armor-atlas.png src/data/armor-atlas.json
